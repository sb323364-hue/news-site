<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новости</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>Новости</h1>
  <p class="sub">Программирование · Идеи проектов</p>
  {% for n in news %}
  <div class="card">
    <a href="{{ n.url }}" target="_blank" class="title">{{ n.title }}</a>
    {% if n.summary %}<p class="summary">{{ n.summary }}</p>{% endif %}
    <div class="meta">
      <span class="src">{{ n.source }}</span>
      <form action="/rate/{{ n.id }}/1" method="post" style="display:inline">
        <button class="btn up" title="Важно">▲</button>
      </form>
      <form action="/rate/{{ n.id }}/-1" method="post" style="display:inline">
        <button class="btn down" title="Не интересно">▼</button>
      </form>
      {% if n.rating == 1 %}<span class="tag good">важно</span>{% endif %}
      {% if n.rating == -1 %}<span class="tag bad">не интересно</span>{% endif %}
    </div>
  </div>
  {% else %}
  <p class="empty">Пока нет новостей. Подожди несколько минут.</p>
  {% endfor %}
</div>
</body>
</html>
